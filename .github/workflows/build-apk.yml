name: Compilar APK

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions sin hacer un push.
  workflow_dispatch:

jobs:
  build:
    name: APK de depuración
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Sin cache: 'npm' a propósito. Esa opción exige package-lock.json y
          # aún no existe, porque no tienes entorno local para generarlo.

      # `npm install` y no `npm ci`: ci exige un package-lock.json que no hay.
      # En la primera ejecución npm resolverá y creará el lock dentro del runner.
      - name: Instalar dependencias
        run: npm install

      - name: Preparar la carpeta www
        run: node scripts/build-www.mjs

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El runner de Ubuntu ya trae el SDK de Android. Esta acción sólo
      # garantiza que las licencias estén aceptadas y el PATH configurado.
      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      # `cap add android` es idempotente: si la carpeta ya viniera commiteada
      # avisa y no la toca, así que sirve en ambos escenarios.
      - name: Crear el proyecto Android
        run: npx cap add android || echo "android/ ya existía, se continúa"

      # Reinyecta adhan.mp3, permisos e iconos. Imprescindible: cap add
      # regenera la carpeta desde una plantilla limpia y se perderían.
      - name: Aplicar personalizaciones nativas
        run: node scripts/apply-native.mjs

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Dar permiso de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar el APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar el APK con la fecha
        run: |
          mkdir -p salida
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "salida/salati-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk"
          ls -lh salida/

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: salati-apk
          path: salida/*.apk
          retention-days: 30
          if-no-files-found: error

      # Si Gradle falla, estos informes dicen exactamente por qué.
      - name: Subir informes de Gradle si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-gradle
          path: android/app/build/reports/
          retention-days: 7
          if-no-files-found: ignore
