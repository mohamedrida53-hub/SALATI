name: Compilar Android

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions sin hacer un push.
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode manual (vacío = automático). Úsalo si Play dice que ese número ya se ha utilizado.'
        required: false
        type: string

jobs:
  build:
    # La revisión va en el NOMBRE del job a propósito: aparece en el listado de
    # Actions sin abrir los registros, así que de un vistazo se sabe si GitHub
    # está ejecutando esta versión del archivo o una anterior que se quedó
    # subida. Súbela cada vez que cambies este workflow.
    name: APK de prueba + AAB para Play Store (rev. 6 · versionName 1.0.18)
    runs-on: ubuntu-latest

    env:
      # Suelo del contador de versiones.
      #
      # El versionCode ya NO es `github.run_number` a secas, y el motivo es un
      # detalle que costó un rechazo de Play: **volver a ejecutar un run no
      # incrementa `run_number`**, sólo `run_attempt`. Al relanzar el run 16 se
      # generó otra vez el versionCode 16, que la consola ya había consumido.
      #
      # Con esta base el número resultante queda muy por encima de cualquiera
      # ya gastado, y `run_attempt` entra en la cuenta para que dos intentos
      # del mismo run nunca produzcan el mismo código. Si algún día hiciera
      # falta forzar uno concreto, está el campo manual de workflow_dispatch.
      SALATI_VERSION_BASE: '100'

      # El nombre del paquete que exige la ficha de Google Play. OJO CON LA
      # DOBLE «i»: es «salatii», no «salati».
      #
      # Se declara aquí para poder comprobar que el proyecto generado coincide.
      # Un paquete NO se puede cambiar nunca una vez publicado, así que un
      # desajuste silencioso sería irreversible: habría que abrir una ficha
      # nueva y perder a todos los usuarios. La fuente de verdad sigue siendo
      # `appId` en capacitor.config.json; esto sólo lo verifica.
      SALATI_APP_ID: com.salatii.app

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # Se decide aquí, en un solo sitio, y se exporta al resto del job.
      # Google Play rechaza cualquier subida cuyo versionCode no sea
      # ESTRICTAMENTE MAYOR que el de la anterior, y un número consumido no se
      # libera jamás, ni aunque borres el borrador de la consola.
      - name: Decidir el versionCode
        # Los valores de GitHub se inyectan por `env` y no interpolando
        # `${{ }}` dentro del script: así un valor inesperado se trata como
        # dato y nunca puede convertirse en comandos del shell.
        env:
          MANUAL: ${{ inputs.version_code }}
          NUMERO: ${{ github.run_number }}
          INTENTO: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          if [ -n "${MANUAL:-}" ]; then
            case "$MANUAL" in
              ''|*[!0-9]*)
                echo "::error::El versionCode manual '$MANUAL' no es un numero entero positivo."
                exit 1 ;;
            esac
            CODIGO="$MANUAL"
            ORIGEN="manual (introducido al lanzar el workflow)"
          else
            # run_attempt entra en la cuenta para que re-ejecutar un run no
            # repita el numero: el intento 1 da +1, el 2 da +2, etc.
            CODIGO=$(( SALATI_VERSION_BASE + NUMERO * 4 + INTENTO - 1 ))
            ORIGEN="automatico (base $SALATI_VERSION_BASE + run $NUMERO x4 + intento $INTENTO)"
          fi

          # Play admite hasta 2100000000. Muy lejos, pero mejor comprobarlo.
          if [ "$CODIGO" -lt 1 ] || [ "$CODIGO" -gt 2100000000 ]; then
            echo "::error::versionCode $CODIGO fuera del rango que admite Google Play."
            exit 1
          fi


          # versionCode es INTERNO: el usuario no lo ve nunca y su única regla
          # es no repetirse jamás. Puede dar saltos sin que importe.
          #
          # versionName es lo que SÍ aparece en la ficha de Play y en los
          # ajustes del móvil, así que sale de `version` en package.json: es una
          # decisión de producto, no un efecto secundario de cuántas veces haya
          # corrido el CI. Antes se ataba al número de ejecución y eso hacía
          # imposible fijar una versión concreta.
          #
          # Los dos números no coinciden ni deben: dos intentos del mismo run
          # comparten versionName y llevan versionCode distinto, que es
          # exactamente lo que Play espera.
          #
          # Se lee con grep y no con node porque este paso corre ANTES de
          # preparar Node.js, y no conviene depender de la versión que el
          # runner traiga de fábrica.
          NOMBRE=$(grep -oP '"version"\s*:\s*"\K[^"]+' package.json | head -1)

          case "$NOMBRE" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::La version '$NOMBRE' de package.json no tiene forma X.Y.Z."
              exit 1 ;;
          esac

          echo "SALATI_VERSION_CODE=$CODIGO" >> "$GITHUB_ENV"
          echo "SALATI_VERSION_NAME=$NOMBRE" >> "$GITHUB_ENV"

          echo "versionCode: $CODIGO   (interno, nunca se repite)"
          echo "versionName: $NOMBRE   (visible en la ficha)"
          echo "origen:      $ORIGEN"

      - name: Comprobar que el versionCode se ha exportado
        run: |
          set -euo pipefail
          test -n "${SALATI_VERSION_CODE:-}" || { echo "::error::el versionCode no se ha exportado"; exit 1; }
          echo "En uso: versionCode=$SALATI_VERSION_CODE  versionName=$SALATI_VERSION_NAME"

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          # Capacitor 8 exige Node 22 o superior; con la 20 el CLI ni arranca.
          node-version: '22'
          # Sin cache: 'npm' a propósito. Esa opción exige package-lock.json y
          # aún no existe, porque no hay entorno local para generarlo.

      # `npm install` y no `npm ci`: ci exige un package-lock.json que no hay.
      - name: Instalar dependencias
        run: npm install

      - name: Preparar la carpeta www
        run: node scripts/build-www.mjs

      # Auditoría independiente de lo que se va a empaquetar de verdad.
      # Comprueba el resultado en disco, no que el paso anterior dijera haber
      # hecho su trabajo. Ver los motivos de cada regla en el propio script.
      - name: Auditar el contenido de www
        run: node scripts/auditar-www.mjs

      # Capacitor 8 trae AGP 8.13 y Gradle 8.14.3, que necesitan JDK 21.
      # Con el 17 la compilación falla al resolver el plugin de Android.
      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # El runner de Ubuntu ya trae el SDK de Android. Esta acción sólo
      # garantiza que las licencias estén aceptadas y el PATH configurado.
      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      # Radiografía del entorno ANTES de generar nada. Si `cap add` falla, lo
      # primero que hay que saber es con qué herramientas y qué configuración
      # estaba trabajando, en vez de deducirlo.
      - name: Comprobar el entorno de Capacitor
        run: |
          set -euo pipefail
          echo "node   $(node --version)"
          echo "npm    $(npm --version)"
          echo "cap    $(npx --no-install cap --version)"
          echo "--- paquetes de Capacitor instalados ---"
          npm ls --depth=0 2>&1 | grep -i capacitor || echo "NINGUNO ENCONTRADO"
          echo "--- @capacitor/android en node_modules ---"
          test -d node_modules/@capacitor/android \
            && echo "presente" \
            || { echo "::error::@capacitor/android no se ha instalado; sin el, cap add android no puede funcionar."; exit 1; }
          echo "--- webDir ---"
          test -d www \
            && echo "www/ con $(find www -type f | wc -l) archivos" \
            || { echo "::error::no existe www/, que es el webDir declarado en capacitor.config.json"; exit 1; }
          echo "--- capacitor.config.json ---"
          cat capacitor.config.json

      # SIN `|| echo`. Enmascarar el fallo aqui es justo lo que hizo que el
      # error apareciera dos pasos mas tarde, en apply-native.mjs, y sin pista
      # alguna sobre su origen. Si `cap add` falla, este paso tiene que morir.
      - name: Crear el proyecto Android
        run: |
          set -euo pipefail
          if [ -d android ]; then
            echo "android/ ya existia; se reutiliza."
          else
            npx --no-install cap add android
          fi

          # No basta con que el comando termine bien: hay que confirmar que la
          # plataforma esta realmente ahi, que es lo que espera el paso siguiente.
          if [ ! -d android/app/src/main ]; then
            echo "::error::cap add android termino sin error pero no ha generado android/app/src/main."
            echo "--- contenido de android/ ---"
            ls -laR android 2>/dev/null | head -60 || echo "(la carpeta no existe)"
            exit 1
          fi
          echo "Proyecto Android generado correctamente."

      # Reinyecta adhan.mp3, permisos, iconos, tema y la config de firma.
      # Imprescindible: cap add regenera la carpeta desde una plantilla limpia.
      - name: Aplicar personalizaciones nativas
        run: node scripts/apply-native.mjs

      - name: Sincronizar Capacitor
        run: npx cap sync android

      # El paquete es lo único de todo el build que no admite marcha atrás:
      # Play lo reserva de por vida en cuanto se publica. Se comprueba contra
      # SALATI_APP_ID antes de gastar minutos compilando.
      - name: Verificar el nombre del paquete
        run: |
          set -euo pipefail
          echo "Esperado: $SALATI_APP_ID"

          fallos=0
          for clave in applicationId namespace; do
            valor=$(grep -oP "$clave\s*=?\s*[\"']\K[^\"']+" android/app/build.gradle | head -1 || true)
            if [ "$valor" = "$SALATI_APP_ID" ]; then
              echo "  ok   $clave = $valor"
            else
              echo "::error::$clave es '$valor' y deberia ser '$SALATI_APP_ID'. Revisa appId en capacitor.config.json."
              fallos=1
            fi
          done

          # Restos del paquete antiguo. `com.salati.app` (una sola i) provoco el
          # rechazo de Play por conflicto de autoridades de proveedor de
          # contenido: androidx-startup deriva la suya del applicationId y tiene
          # que ser unica en toda la tienda.
          if grep -rIl 'com\.salati\.app' android/ >/dev/null 2>&1; then
            echo "::error::quedan referencias al paquete antiguo com.salati.app:"
            grep -rIl 'com\.salati\.app' android/ || true
            fallos=1
          fi

          [ "$fallos" -eq 0 ] || exit 1
          echo "Paquete correcto en todo el proyecto generado."

      # Deja constancia en el registro de que la firma y el versionado se
      # inyectaron de verdad. Si esto no aparece, `bundleRelease` saldría con
      # los valores de la plantilla de Capacitor y Play lo rechazaría.
      - name: Verificar el build.gradle generado
        run: |
          set -euo pipefail
          echo "--- Firma y versionado en app/build.gradle ---"
          grep -n -E 'salatiSigning|versionCode|versionName|signingConfig' \
            android/app/build.gradle || {
              echo "::error::apply-native.mjs no ha parcheado app/build.gradle."
              exit 1
            }

          # Google Play rechaza cualquier subida por debajo de API 36 desde el
          # 31 de agosto de 2026. Es el motivo de estar en Capacitor 8, así que
          # se comprueba aquí en vez de descubrirlo al subir el bundle.
          echo "--- SDK objetivo ---"
          cat android/variables.gradle
          OBJETIVO=$(grep -oP 'targetSdkVersion\s*=\s*\K\d+' android/variables.gradle)
          echo "targetSdkVersion detectado: $OBJETIVO"
          if [ "$OBJETIVO" -lt 36 ]; then
            echo "::error::targetSdk $OBJETIVO. Play exige 36 o superior; revisa la versión de Capacitor."
            exit 1
          fi

      # ---- Firma ----
      # El keystore viaja como secreto en base64 y se materializa aquí, fuera
      # del árbol del repositorio, para no arriesgarse a commitearlo jamás.
      # Si el secreto no existe, este paso no hace nada y el AAB sale sin
      # firmar: exactamente lo que hace falta para la primera descarga.
      - name: Preparar el keystore (si hay secretos)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.SALATI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/salati.keystore"
            echo "SALATI_KEYSTORE_PATH=$RUNNER_TEMP/salati.keystore" >> "$GITHUB_ENV"
            echo "firmado=si" >> "$GITHUB_OUTPUT"
            echo "Keystore preparado: el AAB saldrá FIRMADO."
          else
            echo "firmado=no" >> "$GITHUB_OUTPUT"
            echo "Sin secreto SALATI_KEYSTORE_BASE64: el AAB saldrá SIN FIRMAR."
          fi

      - name: Dar permiso de ejecución a Gradle
        run: chmod +x android/gradlew

      # ---- 1. APK de prueba ----
      # Va firmado con la clave de depuración de Android, así que SÍ se puede
      # instalar en el móvil. Es la única forma de probar la app hoy, porque un
      # AAB sin firmar no es instalable en ningún sitio.
      #
      # Se compila y se SUBE antes que el AAB a propósito: si el bundle falla,
      # el APK ya está guardado y puedes seguir probando la app mientras se
      # arregla el otro.
      - name: Compilar el APK de prueba
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Comprobación de lo que Play rechazó literalmente. Las autoridades de
      # los proveedores de contenido no están en nuestro AndroidManifest: las
      # aportan las librerías (androidx-startup, el FileProvider de Capacitor)
      # usando el marcador ${applicationId}, y sólo aparecen resueltas en el
      # manifiesto FUSIONADO, que no existe hasta después de compilar.
      - name: Verificar las autoridades del manifiesto fusionado
        run: |
          set -euo pipefail
          MANIFIESTO=$(find android/app/build/intermediates -name 'AndroidManifest.xml' -path '*merged_manifest*' -print -quit)
          if [ -z "$MANIFIESTO" ]; then
            echo "No se ha encontrado el manifiesto fusionado; se omite la comprobación."
            exit 0
          fi
          echo "Manifiesto: $MANIFIESTO"

          echo "--- autoridades declaradas ---"
          grep -oP 'android:authorities="\K[^"]+' "$MANIFIESTO" || echo "(ninguna)"

          if grep -q 'android:authorities="[^"]*com\.salati\.app' "$MANIFIESTO"; then
            echo "::error::hay autoridades con el paquete antiguo com.salati.app; Play volveria a rechazarlo."
            exit 1
          fi
          echo "Ninguna autoridad usa el paquete antiguo."

      - name: Reunir el APK
        run: |
          set -euo pipefail
          mkdir -p salida

          APK=$(find android/app/build/outputs/apk -type f -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::Gradle terminó sin errores pero no hay ningún APK."
            find android/app/build/outputs -type f || true
            exit 1
          fi

          cp "$APK" "salida/salati-v${SALATI_VERSION_NAME}-$(date +%Y%m%d)-${GITHUB_SHA::7}-debug.apk"
          ls -lh salida/

      - name: Subir el APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: salati-apk-debug
          path: salida/*.apk
          retention-days: 30
          if-no-files-found: error

      # ---- 2. AAB para Play Store ----
      # El formato que exige Google Play desde agosto de 2021.
      - name: Compilar el AAB para Play Store
        working-directory: android
        env:
          SALATI_KEYSTORE_PASSWORD: ${{ secrets.SALATI_KEYSTORE_PASSWORD }}
          SALATI_KEY_ALIAS: ${{ secrets.SALATI_KEY_ALIAS }}
          SALATI_KEY_PASSWORD: ${{ secrets.SALATI_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Reunir el AAB
        run: |
          set -euo pipefail
          mkdir -p salida
          FIRMA=${{ steps.keystore.outputs.firmado == 'si' && 'firmado' || 'sinfirmar' }}

          echo "--- Todo lo que ha producido Gradle ---"
          find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) || true

          # Se busca en todo `bundle/`, no sólo en `bundle/release`: si algún día
          # cambia el nombre de la variante, el archivo se sigue encontrando.
          # `-print -quit` en vez de `| head -1` porque una tubería enmascara el
          # código de salida de find y el fallo pasaba desapercibido.
          AAB=$(find android/app/build/outputs/bundle -type f -name '*.aab' -print -quit)
          if [ -z "$AAB" ]; then
            echo "::error::bundleRelease terminó sin errores pero no hay ningún .aab."
            exit 1
          fi

          cp "$AAB" "salida/salati-v${SALATI_VERSION_NAME}-$(date +%Y%m%d)-${GITHUB_SHA::7}-$FIRMA.aab"
          ls -lh salida/

      - name: Subir el AAB para Play Store
        uses: actions/upload-artifact@v4
        with:
          name: salati-aab-release
          path: salida/*.aab
          retention-days: 90
          if-no-files-found: error

      - name: Resumen de la compilación
        if: always()
        run: |
          {
            echo "### Compilación de SALATI"
            echo ""
            echo "Workflow \`build-apk.yml\` rev. 6 — versionName desde package.json, APK de prueba + AAB."
            echo ""
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| versionName | \`${SALATI_VERSION_NAME}\` |"
            echo "| versionCode | \`${SALATI_VERSION_CODE}\` |"
            echo "| AAB firmado | ${{ steps.keystore.outputs.firmado == 'si' && 'sí' || 'NO — sólo para inspección' }} |"
            echo ""
            if [ "${{ steps.keystore.outputs.firmado }}" != "si" ]; then
              echo "> El AAB no está firmado, así que Google Play lo rechazará."
              echo "> Instala el APK de depuración para probar la app en el móvil."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Si Gradle falla, estos informes dicen exactamente por qué.
      - name: Subir informes de Gradle si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-gradle
          path: android/app/build/reports/
          retention-days: 7
          if-no-files-found: ignore
